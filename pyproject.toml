[tool.poetry]
name = "tz-t"
version = "0.1.0"
description = "Training backend core for courses/chat platform"
authors = ["Codex <codex@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = {version = "^0.111.0", extras = ["standard"]}
pydantic = "^2.7.1"
uvicorn = {version = "^0.30.0", extras = ["standard"]}
sqlalchemy = "^2.0.30"
asyncpg = "0.30.0"
alembic = "^1.13.1"
psycopg = {version = "^3.1.19", extras = ["binary"]}
passlib = {version = "^1.7.4", extras = ["argon2"]}
pyjwt = "^2.8.0"
pydantic-settings = "^2.3.2"
python-multipart = "^0.0.9"
redis = "^5.0.4"
itsdangerous = "^2.2.0"
minio = "^7.2.7"
boto3 = "^1.34.127"
email-validator = "^2.1.1"
slowapi = "^0.1.9"
httpx = "^0.27.0"
websockets = "^12.0"
rq = "^1.16.2"
jinja2 = "^3.1.4"
structlog = "^24.1.0"
pendulum = "^3.0.0"
greenlet = "^3.2.4"
python-jose = "^3.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.6"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
pre-commit = "^3.7.1"
ruff = "^0.4.5"

[build-system]
requires = ["poetry-core>=1.8.1"]
build-backend = "poetry.core.masonry.api"
